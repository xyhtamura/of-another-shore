<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>namefile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Averia+Sans+Libre:wght@300;400;700&display=swap">
    <link rel="stylesheet" href="namefile.css">
</head>
<body>
    <!-- Placeholder icons, drawn here as SVG. To use other artwork, set
         "icons" in namefile.data.js; see ../ASSETS.md for what may ship. -->
    <svg class="defs" aria-hidden="true" focusable="false">
        <symbol id="i-name" viewBox="0 0 16 16" shape-rendering="crispEdges">
            <path d="M3 1h7l3 3v11H3z" fill="#eff1fe" stroke="#210c0e"/>
            <path d="M10 1v3h3" fill="#c5c8db" stroke="#210c0e"/>
            <path d="M5 7h6M5 9h6M5 11h4" stroke="#b0413e"/>
        </symbol>
        <symbol id="i-house" viewBox="0 0 16 16" shape-rendering="crispEdges">
            <path d="M1 8l7-6 7 6z" fill="#b0413e" stroke="#210c0e"/>
            <path d="M3 8h10v4H3z" fill="#eff1fe" stroke="#210c0e"/>
            <path d="M7 9h2v3H7z" fill="#210c0e"/>
            <path d="M4 12v3M12 12v3M8 12v3" stroke="#210c0e"/>
        </symbol>
        <symbol id="i-island" viewBox="0 0 16 16" shape-rendering="crispEdges">
            <path d="M0 12h16v3H0z" fill="#7f9fc4"/>
            <path d="M2 12c1-4 4-5 6-5s5 1 6 5z" fill="#d9c79a" stroke="#210c0e"/>
            <path d="M8 2v6" stroke="#210c0e"/>
            <path class="flag" d="M8 2h5v3H8z" stroke="#210c0e"/>
        </symbol>
        <symbol id="i-search" viewBox="0 0 8 8" shape-rendering="crispEdges">
            <circle cx="3" cy="3" r="2.2" fill="#eff1fe" stroke="#2f6e2c"/>
            <path d="M5 5l2.5 2.5" stroke="#2f6e2c" stroke-width="1.4"/>
        </symbol>
    </svg>

    <main>
        <h1 class="sr-only">namefile</h1>
        <div id="verse" class="verse"></div>

        <!-- One icon for each operation, in order, down the page. -->
        <ol id="desktop" class="desktop" aria-label="Desktop. One icon for each operation, in order."></ol>

        <section id="listing" class="window" hidden>
            <header class="titlebar"><h2>Listing</h2></header>
            <table class="listing">
                <caption class="sr-only">History of one path. Each row is one operation.</caption>
                <thead>
                    <tr>
                        <th scope="col">Path</th>
                        <th scope="col">Operation</th>
                        <th scope="col">Owner</th>
                        <th scope="col">Date</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </section>
    </main>

    <footer class="taskbar">
        <div class="readout">
            <p id="detail"></p>
            <p id="status"></p>
        </div>
        <div class="controls">
            <button type="button" id="view">Show listing</button>
            <button type="button" id="pause">Pause</button>
            <button type="button" id="share">Copy link</button>
            <button type="button" id="fork">Fork from this step</button>
            <button type="button" id="new">New instance</button>
        </div>
    </footer>
    <noscript>This page needs JavaScript to run.</noscript>
    <script type="module" src="namefile.js"></script>
</body>
</html>
