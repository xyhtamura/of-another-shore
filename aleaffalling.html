<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a leaf falling — of another shore</title>
<link rel="shortcut icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Averia+Sans+Libre:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{ --ink:#4d3c44; }
*{ box-sizing:border-box; }
html{ min-height:100%; }
body{
  min-height:100vh; margin:0; color:var(--ink);
  background:
    radial-gradient(circle at 76% 16%, rgba(246,236,217,.75) 0 4%, transparent 4.5%),
    linear-gradient(168deg,#e9c7d6 0%,#f3ddc0 54%,#a7c9bd 100%);
  font-family:"Averia Sans Libre",sans-serif;
}
.page{
  min-height:100vh; display:grid; place-items:center;
  padding:clamp(26px,6vw,80px) clamp(16px,5vw,48px);
}
.poem-card{
  width:min(100%,430px); padding:clamp(30px,6vw,58px) clamp(24px,5vw,48px);
  background:rgba(246,236,217,.74); border:1px solid rgba(109,74,99,.25);
  border-radius:3px 18px 4px 14px; box-shadow:5px 9px 28px rgba(77,60,68,.16);
}
.poem{
  position:relative; margin:0; overflow:visible; white-space:pre-wrap;
  font:300 clamp(.96rem,2.2vw,1.12rem)/1.7 "Averia Sans Libre",sans-serif;
}
.opening{ position:relative; display:block; height:7em; white-space:nowrap; }
.leaf-word{ white-space:nowrap; }
.letter{ display:inline-block; transform-origin:50% 65%; }
/* Keep the staggered poem readable without JavaScript or with reduced motion. */
.letter-e{ transform:translateY(calc(4.95em * .25)); }
.letter-a{ transform:translateY(calc(4.95em * .75)); }
.letter-f{ transform:translateY(4.95em); }
.is-animated .letter{ transform:none; }
.landing{ display:inline-block; }
</style>
</head>
<body>
<main class="page">
  <article class="poem-card" aria-label="a leaf falling">
    <pre class="poem"><span class="opening">a <span class="leaf-word"><span class="letter letter-l">l</span><span class="letter letter-e">e</span><span class="letter letter-a">a</span><span class="letter letter-f">f</span></span></span><span class="landing">so many ways</span>

of falling: this:

the present: a border

land of time: though

hazy, in a way

one can kind of tell

what might happen:

but I don’t exactly

remember where it

even a second ago.</pre>
  </article>
</main>
<script>
(() => {
  const poem = document.querySelector('.poem');
  const opening = document.querySelector('.opening');
  const landing = document.querySelector('.landing');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const leaves = [
    { element: document.querySelector('.letter-f'), distance: 1, chance: 1 },
    { element: document.querySelector('.letter-a'), distance: .75, chance: .75 },
    { element: document.querySelector('.letter-e'), distance: .25, chance: .25 }
  ];
  const random = (min, max) => min + Math.random() * (max - min);
  let animations = [];
  let generation = 0;

  async function loop(version) {
    while (version === generation) {
      const size = parseFloat(getComputedStyle(poem).fontSize);
      const drop = landing.offsetTop - opening.offsetTop - leaves[0].element.offsetHeight - size * .35;
      const schedule = [];
      let start = 1800;
      for (const leaf of leaves) {
        // Draw independently each loop; skipped letters stay in the word.
        if (Math.random() >= leaf.chance) continue;
        const duration = random(2200, 3100);
        schedule.push({ ...leaf, start, duration });
        start += duration + 300;
      }
      const fade = start + 2000;
      const reset = fade + 650;
      const total = reset + 800;
      animations = schedule.map(({ element, distance, start, duration }) => {
        const drift = random(-.65, .65) * size;
        const sway = random(.65, 1.35) * size;
        const turns = random(1.1, 2.1);
        const direction = Math.random() < .5 ? -1 : 1;
        const tilt = random(-18, 18);
        const frames = [{ offset: 0, transform: 'none', opacity: 1 }];
        frames.push({ offset: start / total, transform: 'none', opacity: 1 });
        let lastTransform;
        for (let step = 1; step <= 40; step++) {
          const t = step / 40;
          const flutter = Math.sin(t * Math.PI * 2 * turns) * Math.sin(t * Math.PI);
          const x = drift * t + direction * sway * flutter;
          const y = drop * distance * t;
          const angle = tilt * t + direction * 42 * flutter;
          lastTransform = `translate(${x}px, ${y}px) rotate(${angle}deg)`;
          frames.push({ offset: (start + duration * t) / total, transform: lastTransform, opacity: 1 });
        }
        frames.push(
          { offset: fade / total, transform: lastTransform, opacity: 1 },
          { offset: reset / total, transform: lastTransform, opacity: 0 },
          { offset: (reset + 1) / total, transform: 'none', opacity: 0 },
          { offset: 1, transform: 'none', opacity: 1 }
        );
        return element.animate(frames, { duration: total, easing: 'linear', fill: 'forwards' });
      });
      if (document.hidden) animations.forEach(animation => animation.pause());
      try {
        await Promise.all(animations.map(animation => animation.finished));
      } catch {
        return; // A resize or motion preference change started a fresh sequence.
      }
      if (version === generation) animations.forEach(animation => animation.cancel());
    }
  }

  function restart() {
    const version = ++generation;
    animations.forEach(animation => animation.cancel());
    animations = [];
    const enabled = !motion.matches && typeof Element.prototype.animate === 'function';
    poem.classList.toggle('is-animated', enabled);
    if (enabled) loop(version);
  }

  motion.addEventListener('change', restart);
  document.addEventListener('visibilitychange', () => {
    animations.forEach(animation => document.hidden ? animation.pause() : animation.play());
  });
  new ResizeObserver(restart).observe(poem);
  document.fonts.ready.then(restart);
})();
</script>
</body>
</html>
